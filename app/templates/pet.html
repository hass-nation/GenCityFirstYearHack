<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet room · PC Pet</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141126; color: #f5f1ff; }
    main { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    a { color: #c6b5ff; }
    h1 { margin: 1rem 0; }
    [role=log] { display: grid; gap: .6rem; max-height: 55vh; min-height: 8rem; overflow: auto; padding: 1rem; background: #1d1930; border-radius: 14px; }
    .bubble { margin: 0; padding: .65rem .85rem; max-width: min(85%, 32rem); width: fit-content; border-radius: 12px; background: #302747; white-space: pre-wrap; overflow-wrap: anywhere; }
    .you { justify-self: end; background: #463861; }
    form { display: flex; flex-wrap: wrap; gap: .6rem; }
    input, button { font: inherit; padding: .65rem; border: 1px solid #766990; border-radius: 8px; }
    input { flex: 1; min-width: 8rem; background: #211b34; color: inherit; }
    button { background: #b6a2ff; color: #211a36; font-weight: 600; }
    button:disabled { opacity: .65; }
    #typing { min-height: 1.5rem; margin: .4rem 0; color: #d5c9eb; }
    .speaker { display: grid; justify-items: center; gap: .8rem; padding-bottom: 1rem; }
    .speaker .bubble { position: relative; background: #eaf6ff; color: #142943; }
    .speaker .bubble::after { position: absolute; content: ""; left: calc(50% - 6px); bottom: -6px; width: 12px; height: 12px; background: inherit; transform: rotate(45deg); }
    .speaker-sprite { display: grid; width: 88px; height: 68px; }
    .speaker-sprite img { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .speaker-sprite img:first-child { animation: talk-frame .6s steps(1, end) infinite reverse; }
    .speaker-sprite img:last-child { animation: talk-frame .6s steps(1, end) infinite; }
    @keyframes talk-frame { 0% { visibility: hidden; } 50%, 100% { visibility: visible; } }
    @media (prefers-reduced-motion: reduce) {
      .speaker-sprite img:first-child { animation: none; }
      .speaker-sprite img:last-child { animation: none; visibility: hidden; }
    }
  </style>
  <script src="{{ url_for('static', filename='pet-chat.js') }}" defer></script>
</head>
<body>
  <main>
    <a href="{{ url_for('home') }}">Back to planner</a>
    <h1>Talk to <span id="pet-name">Wobbles</span></h1>
    <div class="speaker">
      <p id="pet-speech" class="bubble" aria-hidden="true"></p>
      <span class="speaker-sprite" aria-hidden="true">
        <img src="{{ url_for('pet_sprite', filename='camel-1.png') }}" alt="">
        <img src="{{ url_for('pet_sprite', filename='camel-2.png') }}" alt="">
      </span>
    </div>
    <div id="chat-log" role="log" aria-label="Pet chat"></div>
    <p id="typing" role="status"></p>
    <form id="pet-chat" action="{{ url_for('pet_chat.chat') }}">
      <input id="message" aria-label="Message your pet" maxlength="180" required placeholder="Say something to your pet…">
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
